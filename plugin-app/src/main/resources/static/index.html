<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JHarness 设置</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #fff;
            color: #1f2329;
            font-size: 14px;
        }

        /* ===== 整体布局：左侧设置导航 + 右侧内容 ===== */
        .settings { display: flex; height: 100vh; overflow: hidden; }

        /* 左侧导航 */
        .sidebar {
            width: 240px; flex-shrink: 0;
            padding: 20px 16px;
            display: flex; flex-direction: column;
        }
        .sidebar h1 { font-size: 18px; font-weight: 600; padding: 4px 12px 20px; }
        .nav { display: flex; flex-direction: column; gap: 4px; }
        .nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 12px; border-radius: 10px;
            cursor: pointer; color: #1f2329; user-select: none;
            font-size: 14px;
        }
        .nav-item:hover { background: #f5f6f7; }
        .nav-item.active { background: #ececee; font-weight: 500; }
        .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; stroke: #4e5157; }
        .nav-item.active svg { stroke: #1f2329; }

        /* 右侧内容 */
        .content {
            flex: 1; min-width: 0;
            display: flex; flex-direction: column;
            padding: 20px 32px 0 0;
            overflow: hidden;
        }
        .content-header {
            display: flex; justify-content: flex-end; align-items: center; gap: 12px;
            margin-bottom: 8px;
        }
        .btn-ghost {
            border: 1px solid #e5e6eb; background: #fff; color: #1f2329;
            padding: 7px 16px; border-radius: 8px; font-size: 13px; cursor: pointer;
            transition: background .15s;
        }
        .btn-ghost:hover { background: #f5f6f7; }
        .btn-close {
            border: none; background: none; cursor: pointer;
            width: 32px; height: 32px; border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
        }
        .btn-close:hover { background: #f5f6f7; }
        .btn-close svg { width: 18px; height: 18px; stroke: #4e5157; }

        .content-body { flex: 1; overflow-y: auto; padding-bottom: 40px; }
        .page-title { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
        .page-desc { color: #86909c; font-size: 14px; margin-bottom: 24px; }

        /* Tabs */
        .tabs { display: flex; gap: 24px; border-bottom: 1px solid #f0f1f2; margin-bottom: 20px; }
        .tab {
            padding: 8px 2px 10px; cursor: pointer; color: #86909c;
            border-bottom: 2px solid transparent; margin-bottom: -1px;
            font-size: 14px; user-select: none;
        }
        .tab:hover { color: #1f2329; }
        .tab.active { color: #1f2329; font-weight: 500; border-bottom-color: #1f2329; }

        /* 搜索框 */
        .search-box {
            display: flex; align-items: center; gap: 10px;
            border: 1px solid #e5e6eb; border-radius: 12px;
            padding: 11px 14px; margin-bottom: 24px;
        }
        .search-box:focus-within { border-color: #c9cacc; }
        .search-box svg { width: 16px; height: 16px; stroke: #86909c; flex-shrink: 0; }
        .search-box input {
            border: none; outline: none; flex: 1; font-size: 14px;
            background: transparent; color: #1f2329;
        }
        .search-box input::placeholder { color: #a9aeb8; }

        /* 列表计数 */
        .list-count { font-size: 14px; margin-bottom: 14px; }
        .list-count b { font-weight: 600; }
        .list-count .num { color: #86909c; margin-left: 6px; }

        /* 插件卡片网格 */
        .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
        @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
        .plugin-card {
            border: 1px solid #e5e6eb; border-radius: 14px;
            padding: 18px 20px;
        }
        .plugin-row { display: flex; align-items: center; gap: 12px; }
        .plugin-name { font-weight: 600; font-size: 15px; flex-shrink: 0; }
        .plugin-desc {
            font-size: 13px; color: #86909c; min-width: 0;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .plugin-row .plugin-name { cursor: default; }

        /* 状态徽标 */
        .status { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; flex-shrink: 0; margin-left: auto; }
        .status .dot { width: 7px; height: 7px; border-radius: 50%; }
        .status.enabled { color: #0aa344; }
        .status.enabled .dot { background: #0aa344; }
        .status.disabled { color: #86909c; }
        .status .pill {
            background: #e8f8ef; color: #0aa344;
            border-radius: 6px; padding: 2px 10px; font-size: 13px;
        }
        .status.disabled .pill { background: #f5f6f7; color: #86909c; }

        /* 展开箭头 */
        .chevron {
            border: none; background: none; cursor: pointer;
            width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
            transition: transform .15s;
        }
        .chevron:hover { background: #f5f6f7; }
        .chevron svg { width: 14px; height: 14px; stroke: #4e5157; }
        .plugin-card.open .chevron { transform: rotate(180deg); }

        /* 卡片展开区：详情 + 操作 */
        .plugin-detail { display: none; margin-top: 14px; border-top: 1px solid #f0f1f2; padding-top: 12px; }
        .plugin-card.open .plugin-detail { display: block; }
        .plugin-meta { font-size: 12px; color: #86909c; line-height: 1.9; word-break: break-all; margin-bottom: 10px; }
        .plugin-ops { display: flex; flex-wrap: wrap; gap: 8px; }
        .btn-op {
            border: 1px solid #e5e6eb; background: #fff; color: #1f2329;
            padding: 4px 12px; border-radius: 7px; font-size: 12px; cursor: pointer;
            transition: all .15s; white-space: nowrap;
        }
        .btn-op:hover { border-color: #1f2329; }
        .btn-op.primary { background: #1f2329; border-color: #1f2329; color: #fff; }
        .btn-op.primary:hover { background: #3a3d42; }
        .btn-op.danger { color: #d93026; }
        .btn-op.danger:hover { border-color: #d93026; }
        .btn-op:disabled { opacity: .4; cursor: not-allowed; }

        /* 操作区（列表页搜索框之上） */
        .config-panel { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .config-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .config-panel.flash { animation: flash .8s ease; }
        @keyframes flash {
            0%   { background: #f5f6f7; box-shadow: 0 0 0 6px #f5f6f7; border-radius: 10px; }
            100% { background: transparent; box-shadow: 0 0 0 6px transparent; border-radius: 10px; }
        }
        .btn-main {
            border: none; background: #1f2329; color: #fff;
            padding: 9px 18px; border-radius: 9px; font-size: 13px; cursor: pointer;
            transition: background .15s;
        }
        .btn-main:hover { background: #3a3d42; }
        .config-tip { color: #86909c; font-size: 13px; line-height: 1.8; }

        /* 消息条 */
        .msg {
            margin-top: 4px; padding: 10px 14px; border-radius: 9px; font-size: 13px;
            display: none;
        }
        .msg.ok { display: block; background: #e8f8ef; color: #0aa344; border: 1px solid #b4e6c8; }
        .msg.err { display: block; background: #feecec; color: #d93026; border: 1px solid #f5c6c6; }

        .empty { text-align: center; color: #86909c; padding: 48px 0; grid-column: 1 / -1; }

        /* 其它 nav 占位页 */
        .placeholder { color: #86909c; padding: 60px 0; text-align: center; display: none; }
    </style>
</head>
<body>
<div class="settings">
    <!-- 左侧设置导航 -->
    <aside class="sidebar">
        <h1>设置</h1>
        <nav class="nav" id="nav">
            <div class="nav-item" data-page="general">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                通用设置
            </div>
            <div class="nav-item" data-page="models">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9l3 3-3 3"/><path d="M13 15h4"/></svg>
                模型
            </div>
            <div class="nav-item active" data-page="plugins">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="1.6" fill="#fff"/><circle cx="15" cy="12" r="1.6" fill="#fff"/><circle cx="8" cy="18" r="1.6" fill="#fff"/></svg>
                插件
            </div>
        </nav>
    </aside>

    <!-- 右侧内容 -->
    <main class="content">
        <div class="content-header">
            <button class="btn-ghost" id="btnOpenConfig">打开配置文件</button>
            <button class="btn-close" id="btnClose" title="关闭">
                <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
            </button>
        </div>

        <div class="content-body">
            <!-- 插件页 -->
            <div id="page-plugins">
                <div class="page-title">插件</div>
                <div class="page-desc">配置和查看本部署已安装的插件。</div>

                <div class="tabs">
                    <div class="tab" data-tab="config">插件配置</div>
                    <div class="tab active" data-tab="list">插件列表</div>
                </div>

                <!-- 操作区（原「插件配置」页功能，已上移至搜索框之上） -->
                <div class="config-panel" id="opsPanel">
                    <div class="config-row">
                        <input type="file" id="file" accept=".jar,.zip" style="display:none">
                        <button class="btn-main" id="btnUpload">上传插件</button>
                        <button class="btn-ghost" id="btnReload">重新扫描</button>
                        <button class="btn-ghost" id="btnRefresh">刷新列表</button>
                    </div>
                    <div class="config-tip">
                        支持上传 <b>.jar / .zip</b> 插件包，上传后自动加载并启动；也可将插件放入 <code>plugins/</code> 目录后点击「重新扫描」。
                    </div>
                    <div id="msg" class="msg"></div>
                </div>

                <!-- 插件列表 -->
                <div id="tab-list">
                    <div class="search-box">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
                        <input type="text" id="search" placeholder="搜索插件">
                    </div>
                    <div class="list-count"><b>插件列表</b><span class="num" id="count">0</span></div>
                    <div class="grid" id="pluginGrid">
                        <div class="empty">加载中…</div>
                    </div>
                </div>
            </div>

            <!-- 其它导航占位页 -->
            <div class="placeholder" id="page-placeholder">该模块暂未开放，当前仅提供「插件」管理。</div>
        </div>
    </main>
</div>

<script>
    const $ = id => document.getElementById(id);

    /* ---------- 导航切换 ---------- */
    $('nav').addEventListener('click', e => {
        const item = e.target.closest('.nav-item');
        if (!item) return;
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        item.classList.add('active');
        const isPlugins = item.dataset.page === 'plugins';
        $('page-plugins').style.display = isPlugins ? '' : 'none';
        $('page-placeholder').style.display = isPlugins ? 'none' : '';
    });

    /* ---------- Tab 切换 ---------- */
    // 「插件配置」功能已上移到列表页顶部，两个 Tab 共用同一内容区；
    // 点击「插件配置」时回到内容区顶部并高亮操作区。
    document.querySelectorAll('.tab').forEach(tab => {
        tab.onclick = () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            document.querySelector('.content-body').scrollTo({ top: 0, behavior: 'smooth' });
            const ops = $('opsPanel');
            ops.classList.remove('flash');
            void ops.offsetWidth;
            ops.classList.add('flash');
        };
    });

    /* ---------- 顶部按钮 ---------- */
    $('btnOpenConfig').onclick = () => showMsg('插件目录为项目根的 plugins/，共享依赖位于 plugins/.lib/', true);
    $('btnClose').onclick = () => showMsg('这是独立的设置页面，可通过浏览器返回。', true);

    /* ---------- API ---------- */
    async function api(url, options) {
        const res = await fetch(url, options);
        const body = await res.json();
        if (body.code !== 200) throw new Error(body.message || '请求失败');
        return body.data;
    }

    let plugins = [];

    function showMsg(text, ok) {
        const m = $('msg');
        m.className = 'msg ' + (ok ? 'ok' : 'err');
        m.textContent = text;
        setTimeout(() => m.style.display = 'none', 5000);
    }

    /* ---------- 插件列表渲染 ---------- */
    const isEnabled = p => p.state === 'STARTED';
    // 列表中名称后的描述最多 10 个字，超出以 … 结尾
    const shortDesc = s => {
        const t = (s || '').trim();
        return t.length > 10 ? t.slice(0, 10) + '…' : t;
    };
    const statusHTML = p => isEnabled(p)
        ? `<span class="status enabled"><span class="dot"></span><span class="pill">已启用</span></span>`
        : `<span class="status disabled" title="${p.state || ''}"><span class="pill">已停用</span></span>`;

    function render() {
        const kw = $('search').value.trim().toLowerCase();
        const list = plugins.filter(p =>
            !kw || p.id.toLowerCase().includes(kw) || (p.description || '').toLowerCase().includes(kw));
        $('count').textContent = list.length;

        const grid = $('pluginGrid');
        if (!list.length) {
            grid.innerHTML = `<div class="empty">${plugins.length ? '未找到匹配的插件' : '暂无插件，请点击上方「上传插件」，或将插件放入 plugins/ 后点击「重新扫描」'}</div>`;
            return;
        }
        grid.innerHTML = list.map(p => `
            <div class="plugin-card" id="card-${p.id}">
                <div class="plugin-row">
                    <span class="plugin-name" title="${p.id}">${p.id}</span>
                    <span class="plugin-desc" title="${p.description || ''}">${shortDesc(p.description)}</span>
                    ${statusHTML(p)}
                    <button class="chevron" onclick="toggleCard('${p.id}')" title="展开操作">
                        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                    </button>
                </div>
                <div class="plugin-detail">
                    <div class="plugin-meta">
                        描述：${p.description || '-'}<br>
                        版本：${p.version} ｜ 提供者：${p.provider || '-'} ｜ 状态：${p.state || '-'}<br>
                        路径：${p.path}
                    </div>
                    <div class="plugin-ops">
                        <button class="btn-op" onclick="act('${p.id}','load')">Load</button>
                        <button class="btn-op primary" onclick="act('${p.id}','start')" ${isEnabled(p) ? 'disabled' : ''}>Start</button>
                        <button class="btn-op" onclick="act('${p.id}','stop')" ${!isEnabled(p) ? 'disabled' : ''}>Stop</button>
                        <button class="btn-op" onclick="act('${p.id}','enable')">Enable</button>
                        <button class="btn-op" onclick="act('${p.id}','disable')">Disable</button>
                        <button class="btn-op" onclick="act('${p.id}','unload')">Unload</button>
                        <button class="btn-op danger" onclick="act('${p.id}','delete')">Delete</button>
                    </div>
                </div>
            </div>`).join('');
    }

    function toggleCard(id) {
        document.querySelectorAll('.plugin-card.open').forEach(c => { if (c.id !== 'card-' + id) c.classList.remove('open'); });
        $('card-' + id).classList.toggle('open');
    }

    async function loadPlugins() {
        try {
            plugins = await api('/api/plugins');
            render();
        } catch (e) {
            $('pluginGrid').innerHTML = `<div class="empty">${e.message}</div>`;
        }
    }

    async function act(id, action) {
        const method = action === 'delete' ? 'DELETE' : 'POST';
        const url = action === 'delete' ? `/api/plugins/${id}` : `/api/plugins/${id}/${action}`;
        try {
            const data = await api(url, { method });
            showMsg(typeof data === 'string' ? data : `插件 ${id} 操作成功`, true);
            loadPlugins();
        } catch (e) {
            showMsg(e.message, false);
        }
    }

    /* ---------- 搜索 ---------- */
    $('search').oninput = render;

    /* ---------- 上传 / 重扫 / 刷新 ---------- */
    $('btnUpload').onclick = () => $('file').click();
    $('file').onchange = async e => {
        const file = e.target.files[0];
        if (!file) return;
        const fd = new FormData();
        fd.append('file', file);
        try {
            const data = await api('/api/plugins/upload', { method: 'POST', body: fd });
            showMsg(`插件 ${data.id} 上传并启动成功，状态: ${data.state}`, true);
            loadPlugins();
        } catch (err) {
            showMsg(err.message, false);
        }
        e.target.value = '';
    };
    $('btnReload').onclick = async () => {
        try { await api('/api/plugins/reload', { method: 'POST' }); showMsg('重新扫描完成', true); loadPlugins(); }
        catch (e) { showMsg(e.message, false); }
    };
    $('btnRefresh').onclick = loadPlugins;

    loadPlugins();
</script>
</body>
</html>
